<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planifica tu viaje · República Dominicana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&amp;family=Instrument+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; document.documentElement.dataset.palette = localStorage.getItem('palette') || 'red';</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="planifica">
  <header id="topbar">
    <button id="burger" type="button" aria-label="Abrir menú">☰</button>
    <ul id="menu">
      <li><button type="button" class="logo" id="logo" aria-label="Cambiar colores de la página (rojo / azul)" title="Cambiar colores"><span class="flag"></span></button></li>
      <li><a href="index.html" data-nav="inicio">Inicio</a></li>
      <li><a href="conoce.html" data-nav="conoce">Conoce RD</a></li>
      <li><a href="planifica.html" data-nav="planifica">Planifica</a></li>
      <li><a href="https://www.booking.com/flights/" target="_blank" rel="noopener">Planea tu vuelo</a></li>
    </ul>
    <button id="theme" type="button" aria-label="Cambiar tema">🌙</button>
  </header>
  <div id="scrim"></div>

  <main class="wrap">
    <h1 class="page-title">Planifica tu ruta</h1>
    <div class="plan">
      <aside id="sidebar-plan">
        <input id="q" type="search" placeholder="Buscar lugares o favoritos…" aria-label="Buscar">
        <label style="font-weight:600; font-size:0.9rem;">Filtrar favoritos por etiqueta:
          <select id="fav-filter-select">
            <option value="">Todos los lugares</option>
            <option value="solo-favs">Solo mis favoritos</option>
          </select>
        </label>
        <div class="row">
          <button class="btn alt" id="ruta" type="button">Trazar ruta</button>
        </div>
        <ul class="lista" id="lista"></ul>
        <p class="note" id="info">Pasa el ratón por un lugar para ver su descripción.</p>
      </aside>
      <div style="display:flex; flex-direction:column; gap:1rem;">
        <div id="map"><p id="mapmsg">Cargando mapa…</p></div>
        <div id="ruta-resultado" hidden></div>
      </div>
    </div>
  </main>
  <button id="toggle-sidebar" type="button">Buscador / Ruta</button>

  <footer>© República Dominicana · Guía de viaje</footer>
</body>
</html>
